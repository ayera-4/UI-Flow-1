<!-- @dsCard group="Type" viewport="700x230" name="Display & Headings — Fredoka" subtitle="Chunky rounded display face for titles and big wins" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); color: var(--text-strong); }
  .item { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--gm-line-soft); }
  .item:last-child { border: none; }
  .spec { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-muted); width: 130px; flex: none; }
</style>
</head>
<body>
  <div class="item"><span class="spec">--text-display<br>700 · 44px</span><span style="font:var(--text-display)">Well Done!</span></div>
  <div class="item"><span class="spec">--text-h1<br>600 · 32px</span><span style="font:var(--text-h1)">My Community</span></div>
  <div class="item"><span class="spec">--text-h2<br>600 · 26px</span><span style="font:var(--text-h2)">Choose a level</span></div>
  <div class="item"><span class="spec">--text-h3<br>600 · 21px</span><span style="font:var(--text-h3)">Counting Money</span></div>
</body>
</html>
