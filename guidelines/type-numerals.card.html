<!-- @dsCard group="Type" viewport="700x170" name="Numerals — Scores & Keypad" subtitle="Heavy Nunito weights for KPIs, coins, PIN keys" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); color: var(--text-strong);
         display: flex; gap: 40px; align-items: center; }
  .blk { text-align: center; }
  .spec { margin-top: 8px; font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-muted); }
  .key { width: 56px; height: 56px; border-radius: 50%; background: var(--gm-green); color: #fff;
         display: inline-flex; align-items: center; justify-content: center; font: var(--text-numkey);
         box-shadow: 0 4px 0 var(--gm-green-dark); margin: 0 4px; }
</style>
</head>
<body>
  <div class="blk"><span style="font:var(--text-kpi); color:var(--gm-blue-dark)">92%</span><div class="spec">--text-kpi · 800 · 30px</div></div>
  <div class="blk"><span style="font:var(--text-kpi); color:var(--gm-orange)">450</span><div class="spec">coins / XP</div></div>
  <div class="blk"><span class="key">7</span><span class="key" style="background:var(--gm-blue); box-shadow:0 4px 0 var(--gm-blue-dark)">2</span><div class="spec">--text-numkey · 700 · 26px</div></div>
</body>
</html>
