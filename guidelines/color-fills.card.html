<!-- @dsCard group="Colors" viewport="700x150" name="Tier Card Fills" subtitle="Soft tints for level/tier cards — green, yellow, purple, blue" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); display: flex; gap: 14px; }
  .sw { flex: 1; padding: 16px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
  .t { font: var(--text-h3); font-family: var(--font-display); color: var(--text-strong); }
  .s { font: var(--text-sm); font-family: var(--font-body); font-weight: 700; color: var(--text-muted); }
  code { display: block; font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>
  <div class="sw" style="background:var(--gm-fill-green)"><div class="t">Level 1</div><div class="s">Beginner</div><code>--gm-fill-green</code></div>
  <div class="sw" style="background:var(--gm-fill-yellow)"><div class="t">Level 2</div><div class="s">Intermediate</div><code>--gm-fill-yellow</code></div>
  <div class="sw" style="background:var(--gm-fill-purple)"><div class="t">Level 3</div><div class="s">Advanced</div><code>--gm-fill-purple</code></div>
  <div class="sw" style="background:var(--gm-fill-blue)"><div class="t">Info</div><div class="s">Neutral</div><code>--gm-fill-blue</code></div>
</body>
</html>
