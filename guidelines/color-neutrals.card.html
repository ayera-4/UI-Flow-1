<!-- @dsCard group="Colors" viewport="700x130" name="Ink & Neutrals" subtitle="Text and hairline scale — deep blue-navy ink" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); display: flex; gap: 10px; }
  .sw { flex: 1; text-align: center; }
  .chip { height: 56px; border-radius: var(--radius-sm); border: 1px solid var(--gm-line); }
  .n { margin-top: 6px; font: var(--text-xs); font-family: var(--font-body); font-weight: 800; color: var(--text-strong); }
  code { display: block; font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="sw"><div class="chip" style="background:var(--gm-ink)"></div><div class="n">Ink</div><code>#283558</code></div>
  <div class="sw"><div class="chip" style="background:var(--gm-ink-soft)"></div><div class="n">Ink soft</div><code>--gm-ink-soft</code></div>
  <div class="sw"><div class="chip" style="background:var(--gm-slate)"></div><div class="n">Slate</div><code>--gm-slate</code></div>
  <div class="sw"><div class="chip" style="background:var(--gm-mute)"></div><div class="n">Mute</div><code>--gm-mute</code></div>
  <div class="sw"><div class="chip" style="background:var(--gm-line)"></div><div class="n">Line</div><code>--gm-line</code></div>
  <div class="sw"><div class="chip" style="background:var(--gm-line-soft)"></div><div class="n">Line soft</div><code>--gm-line-soft</code></div>
</body>
</html>
