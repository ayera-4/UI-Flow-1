<!-- @dsCard group="Type" viewport="700x250" name="Body & UI — Nunito" subtitle="Rounded, highly legible text for learners aged 8–13" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); color: var(--text-strong); }
  .item { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--gm-line-soft); }
  .item:last-child { border: none; }
  .spec { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-muted); width: 130px; flex: none; }
</style>
</head>
<body>
  <div class="item"><span class="spec">--text-lead<br>600 · 19px</span><span style="font:var(--text-lead)">Buy the items below.</span></div>
  <div class="item"><span class="spec">--text-base<br>500 · 17px</span><span style="font:var(--text-base)">Drag the correct coins to the payment area to pay for your snacks.</span></div>
  <div class="item"><span class="spec">--text-ui<br>700 · 16px</span><span style="font:var(--text-ui)">LET'S GO!</span></div>
  <div class="item"><span class="spec">--text-sm<br>600 · 14px</span><span style="font:var(--text-sm)">Recent Learners</span></div>
  <div class="item"><span class="spec">--text-xs<br>700 · 12px</span><span style="font:var(--text-xs); letter-spacing:var(--ls-label); text-transform:uppercase">Available</span></div>
</body>
</html>
