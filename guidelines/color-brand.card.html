<!-- @dsCard group="Colors" viewport="700x150" name="Brand Trio" subtitle="Genius=orange · Math=blue · AFRICA=green — the wordmark colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .chip { height: 78px; display: flex; align-items: flex-end; padding: 10px; }
  .chip .h { color: #fff; font: var(--text-h3); font-family: var(--font-display); }
  .meta { padding: 8px 10px; font: var(--text-sm); font-family: var(--font-body); color: var(--text-body); }
  .meta b { display: block; color: var(--text-strong); font-weight: 800; }
  code { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--gm-orange)"><span class="h">Genius</span></div>
    <div class="meta"><b>Orange</b><code>--gm-orange · #F2880E</code></div></div>
  <div class="sw"><div class="chip" style="background:var(--gm-blue)"><span class="h">Math</span></div>
    <div class="meta"><b>Blue</b><code>--gm-blue · #2E7BC4</code></div></div>
  <div class="sw"><div class="chip" style="background:var(--gm-green)"><span class="h">AFRICA</span></div>
    <div class="meta"><b>Green</b><code>--gm-green · #4D9736</code></div></div>
</div>
</body>
</html>
