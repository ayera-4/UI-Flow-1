<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-app); }
  .sec { background: var(--surface-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
         padding: 18px 20px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .lbl { font: var(--text-xs); font-family: var(--font-body); font-weight: 700; letter-spacing: var(--ls-label);
         text-transform: uppercase; color: var(--text-faint); margin-bottom: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { SegmentedTabs, BottomNav } = window.GeniusMathAfricaDesignSystem_a3431c;
  function Icon({ name, size = 22 }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      if (window.lucide && ref.current) {
        ref.current.innerHTML = '<i data-lucide="' + name + '"></i>';
        window.lucide.createIcons({ attrs: { width: size, height: size, 'stroke-width': 2.4 } });
      }
    });
    return <span ref={ref} style={{ display: 'inline-flex' }} />;
  }
  function Demo() {
    const [mode, setMode] = React.useState('learner');
    const [range, setRange] = React.useState('week');
    const [tab, setTab] = React.useState('world');
    return (
      <div>
        <div className="sec">
          <div className="lbl">SegmentedTabs</div>
          <div className="row">
            <SegmentedTabs value={mode} onChange={setMode} tabs={[
              { id: 'learner', label: 'Learner Login' },
              { id: 'teacher', label: 'Teacher Login' },
              { id: 'guest', label: 'Guest Play' },
            ]} />
            <SegmentedTabs tone="green" size="sm" value={range} onChange={setRange} tabs={[
              { id: 'day', label: 'Daily' },
              { id: 'week', label: 'Weekly' },
              { id: 'month', label: 'Monthly' },
            ]} />
          </div>
        </div>

        <div className="sec">
          <div className="lbl">BottomNav — learner</div>
          <BottomNav value={tab} onChange={setTab} style={{ borderRadius: 'var(--radius-lg)', border: '1.5px solid var(--gm-line-soft)' }} items={[
            { id: 'world', label: 'World', icon: <Icon name="globe" /> },
            { id: 'quests', label: 'Quests', icon: <Icon name="compass" /> },
            { id: 'rewards', label: 'Rewards', icon: <Icon name="star" /> },
            { id: 'profile', label: 'Profile', icon: <Icon name="user" /> },
          ]} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
