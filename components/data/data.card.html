<!-- @dsCard group="Components" viewport="700x220" name="Data — KpiCard" subtitle="Dashboard metric tiles for learner & educator views" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-app); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { KpiCard } = window.GeniusMathAfricaDesignSystem_a3431c;
  function Icon({ name, size = 16 }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      if (window.lucide && ref.current) {
        ref.current.innerHTML = '<i data-lucide="' + name + '"></i>';
        window.lucide.createIcons({ attrs: { width: size, height: size, 'stroke-width': 2.4 } });
      }
    });
    return <span ref={ref} style={{ display: 'inline-flex' }} />;
  }
  function Demo() {
    return (
      <div className="grid">
        <KpiCard label="Levels Completed" value="8" tone="blue" icon={<Icon name="layers" />} />
        <KpiCard label="Coins Earned" value="450" tone="gold" icon={<Icon name="coins" />} />
        <KpiCard label="Time Spent" value="2h 30m" tone="green" icon={<Icon name="clock" />} />
        <KpiCard label="Accuracy" value="92%" tone="purple" icon={<Icon name="target" />} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
